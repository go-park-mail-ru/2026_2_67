services:
  app:
    image: vibe_market_backend
    build: .
    container_name: vibe_market_backend
    restart: unless-stopped
    ports:
      - "${APP_PORT}:8080"
    env_file:
      - .env
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
    networks:
      - vibe_net

  db:
    image: postgres:16-alpine
    container_name: vibe_market_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vibe_net

  redis:
    image: redis:7-alpine
    container_name: vibe_market_redis
    restart: unless-stopped
    ports:
      - "6380:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vibe_net

  storage:
    image: pgsty/minio:latest 
    container_name: vibe_market_storage
    restart: unless-stopped
    ports:
      - "8090:${STORAGE_PORT}" 
    environment:
      MINIO_ROOT_USER: ${STORAGE_USER}
      MINIO_ROOT_PASSWORD: ${STORAGE_PASSWORD}
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: server /data --console-address ":9001"
    networks:
      - vibe_net

  migrate:
    image: migrate/migrate:v4.18.1
    container_name: vibe_market_migrate
    volumes:
      - ./db/migrations:/migrations 
    command: [
      "-path", "/migrations",
      "-database", "postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable",
      "up"
    ]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vibe_net
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
  storage_data:

networks:
  vibe_net:
    driver: bridge
